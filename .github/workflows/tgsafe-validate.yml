name: TG Safe validation

on:
  push:
    branches:
      - tgsafe-core
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  static-safety-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate TG Safe anchors and hard rails
        run: python3 tools/validate_tgsafe.py
