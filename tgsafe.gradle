/*
 * TG Safe source guards.
 *
 * Telegram's Android client keeps safety-sensitive actions in very large
 * upstream source files. This build task inserts tiny, idempotent guards
 * before Android preBuild. If Telegram changes an expected anchor, the build
 * FAILS instead of silently producing an unsafe APK.
 */

final File tgSafeRoot = rootProject.projectDir
final File tgSafeGeneratedSourceRoot = new File(tgSafeRoot, "TMessagesProj/build/generated/tgsafe")

def normalizeLf = { String text -> text.replace("\r\n", "\n").replace("\r", "\n") }

def patchAfterLiteral = { String relativePath, String marker, String needle, String insertion ->
    File file = new File(tgSafeRoot, relativePath)
    if (!file.isFile()) {
        throw new GradleException("TG Safe: missing source file: ${relativePath}")
    }

    String text = normalizeLf(file.getText("UTF-8"))
    if (text.contains(marker)) {
        return
    }

    int index = text.indexOf(needle)
    if (index < 0) {
        throw new GradleException("TG Safe: upstream drift while applying ${marker} to ${relativePath}")
    }

    int at = index + needle.length()
    text = text.substring(0, at) + insertion + text.substring(at)
    file.setText(text, "UTF-8")
}

def patchBeforeLiteral = { String relativePath, String marker, String needle, String insertion ->
    File file = new File(tgSafeRoot, relativePath)
    if (!file.isFile()) {
        throw new GradleException("TG Safe: missing source file: ${relativePath}")
    }

    String text = normalizeLf(file.getText("UTF-8"))
    if (text.contains(marker)) {
        return
    }

    int index = text.indexOf(needle)
    if (index < 0) {
        throw new GradleException("TG Safe: upstream drift while applying ${marker} to ${relativePath}")
    }

    text = text.substring(0, index) + insertion + text.substring(index)
    file.setText(text, "UTF-8")
}

def replaceLiteral = { String relativePath, String marker, String needle, String replacement ->
    File file = new File(tgSafeRoot, relativePath)
    if (!file.isFile()) {
        throw new GradleException("TG Safe: missing source file: ${relativePath}")
    }

    String text = normalizeLf(file.getText("UTF-8"))
    if (text.contains(marker)) {
        return
    }

    int index = text.indexOf(needle)
    if (index < 0) {
        throw new GradleException("TG Safe: upstream drift while applying ${marker} to ${relativePath}")
    }

    text = text.substring(0, index) + replacement + text.substring(index + needle.length())
    file.setText(text, "UTF-8")
}

def patchImport = { String relativePath, String marker, String anchorImport, String importLine ->
    patchAfterLiteral(relativePath, marker, anchorImport, "\n${importLine} // ${marker}")
}

def writeGeneratedApiCredentials = {
    String apiId = System.getenv("TGSAFE_API_ID")
    String apiHash = System.getenv("TGSAFE_API_HASH")
    if (apiId == null || apiId.trim().isEmpty()) {
        Object p = rootProject.findProperty("TGSAFE_API_ID")
        apiId = p == null ? "" : p.toString()
    }
    if (apiHash == null || apiHash.trim().isEmpty()) {
        Object p = rootProject.findProperty("TGSAFE_API_HASH")
        apiHash = p == null ? "" : p.toString()
    }
    apiId = apiId.trim()
    apiHash = apiHash.trim()

    boolean anyCustom = !apiId.isEmpty() || !apiHash.isEmpty()
    if (anyCustom && (apiId.isEmpty() || apiHash.isEmpty())) {
        throw new GradleException("TG Safe: TGSAFE_API_ID and TGSAFE_API_HASH must be provided together")
    }

    if (!anyCustom) {
        apiId = "4"
        apiHash = "014b35b6184100b085b0d0572f9b5103"
        logger.lifecycle("TG Safe: building with Telegram public placeholder API credentials")
    } else {
        if (!(apiId ==~ /[0-9]+/)) {
            throw new GradleException("TG Safe: TGSAFE_API_ID must contain digits only")
        }
        if (!(apiHash ==~ /[0-9a-fA-F]{32}/)) {
            throw new GradleException("TG Safe: TGSAFE_API_HASH must be a 32-character hexadecimal string")
        }
        logger.lifecycle("TG Safe: custom Telegram API credentials supplied for this build")
    }

    File packageDir = new File(tgSafeGeneratedSourceRoot, "org/telegram/messenger")
    if (!packageDir.exists() && !packageDir.mkdirs()) {
        throw new GradleException("TG Safe: could not create generated source directory")
    }
    File generated = new File(packageDir, "SafeApiCredentials.java")
    generated.setText("""package org.telegram.messenger;\n\npublic final class SafeApiCredentials {\n    public static final int API_ID = ${apiId};\n    public static final String API_HASH = "${apiHash}";\n    private SafeApiCredentials() {}\n}\n""", "UTF-8")
}

def applyTgSafe = tasks.register("applyTgSafePatches") {
    group = "tg safe"
    description = "Apply fail-closed TG Safe guards to Telegram Android sources"

    doLast {
        final String enterView = "TMessagesProj/src/main/java/org/telegram/ui/Components/ChatActivityEnterView.java"
        final String sendHelper = "TMessagesProj/src/main/java/org/telegram/messenger/SendMessagesHelper.java"
        final String locationController = "TMessagesProj/src/main/java/org/telegram/messenger/LocationController.java"
        final String cameraController = "TMessagesProj/src/main/java/org/telegram/messenger/camera/CameraController.java"
        final String voipService = "TMessagesProj/src/main/java/org/telegram/messenger/voip/VoIPService.java"
        final String voipPre = "TMessagesProj/src/main/java/org/telegram/messenger/voip/VoIPPreNotificationService.java"
        final String loginActivity = "TMessagesProj/src/main/java/org/telegram/ui/LoginActivity.java"
        final String launchActivity = "TMessagesProj/src/main/java/org/telegram/ui/LaunchActivity.java"
        final String buildVars = "TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java"

        writeGeneratedApiCredentials()
        replaceLiteral(buildVars, "TGSAFE_API_ID", "public static int APP_ID = 4;",
                "public static int APP_ID = SafeApiCredentials.API_ID; // TGSAFE_API_ID")
        replaceLiteral(buildVars, "TGSAFE_API_HASH", "public static String APP_HASH = \"014b35b6184100b085b0d0572f9b5103\";",
                "public static String APP_HASH = SafeApiCredentials.API_HASH; // TGSAFE_API_HASH")

        // Login policy for an unofficial privacy fork. Do not depend on the
        // official Firebase/Play Integrity SMS path or flash-call permissions.
        patchImport(loginActivity, "TGSAFE_LOGIN_IMPORT", "import org.telegram.messenger.SharedConfig;", "import org.telegram.messenger.SafeMode;")
        patchAfterLiteral(loginActivity, "TGSAFE_LOGIN_CTOR_POLICY",
                "public LoginActivity() {\n        super();",
                '''
        if (SafeMode.ENABLED) { // TGSAFE_LOGIN_CTOR_POLICY
            checkPermissions = false;
            checkShowPermissions = false;
            forceDisableSafetyNet = true;
        }''')
        patchAfterLiteral(loginActivity, "TGSAFE_LOGIN_ACCOUNT_CTOR_POLICY",
                "public LoginActivity(int account) {\n        super();",
                '''
        if (SafeMode.ENABLED) { // TGSAFE_LOGIN_ACCOUNT_CTOR_POLICY
            checkPermissions = false;
            checkShowPermissions = false;
            forceDisableSafetyNet = true;
        }''')
        patchAfterLiteral(loginActivity, "TGSAFE_LOGIN_CODE_DELIVERY_POLICY",
                "settings.allow_app_hash = settings.allow_firebase = PushListenerController.GooglePushListenerServiceProvider.INSTANCE.hasServices();",
                '''
            if (SafeMode.disableFirebaseLoginVerification()) { // TGSAFE_LOGIN_CODE_DELIVERY_POLICY
                settings.allow_flashcall = false;
                settings.allow_missed_call = false;
                settings.allow_app_hash = false;
                settings.allow_firebase = false;
            }''')
        patchBeforeLiteral(loginActivity, "TGSAFE_LOGIN_API_ERROR",
                "} else if (error.text.contains(\"PHONE_NUMBER_INVALID\")) {",
                '''} else if (SafeMode.ENABLED && (error.text.contains("API_ID_INVALID") || error.text.contains("API_ID_PUBLISHED_FLOOD"))) { // TGSAFE_LOGIN_API_ERROR
                            needShowAlert("TG Safe", "Для входа в TG Safe нужны собственные Telegram api_id и api_hash. Публичные значения из исходников Telegram не подходят для этого форка.");
                        ''')

        // Voice messages and round-video messages.
        patchImport(enterView, "TGSAFE_IMPORT", "import org.telegram.messenger.SharedConfig;", "import org.telegram.messenger.SafeMode;")

        patchAfterLiteral(
                enterView,
                "TGSAFE_RECORD_GUARD",
                "private Runnable recordAudioVideoRunnable = new Runnable() {\n        @Override\n        public void run() {",
                '''
            if (SafeMode.blockVoiceOrVideoMessage(isInVideoMode())) { // TGSAFE_RECORD_GUARD
                SafeMode.showBlocked(parentActivity, isInVideoMode() ? "Кружочки отключены в TG Safe" : "Голосовые отключены в TG Safe");
                return;
            }'''
        )

        patchAfterLiteral(
                enterView,
                "TGSAFE_VIDEO_MESSAGE_GUARD",
                "private Runnable onFinishInitCameraRunnable = new Runnable() {\n        @Override\n        public void run() {",
                '''
            if (SafeMode.blockVideoMessageRecording()) { // TGSAFE_VIDEO_MESSAGE_GUARD
                SafeMode.showBlocked(parentActivity, "Кружочки отключены в TG Safe");
                return;
            }'''
        )

        // EXIF scrubber: any still image that reaches Telegram's document/file
        // send path is replaced with a scrubbed cache copy. Failure blocks send.
        patchAfterLiteral(
                sendHelper,
                "TGSAFE_EXIF_DOCUMENT_GUARD",
                "final long forcedPollGroupId = pollSendParams != null ? pollSendParams.groupId : 0;",
                '''
        if (SafeMode.scrubExif()) { // TGSAFE_EXIF_DOCUMENT_GUARD
            SafeExifScrubber.Result safeExif = SafeExifScrubber.sanitizeImageDocument(path, uri, mime);
            if (safeExif.candidateImage) {
                if (!safeExif.success) {
                    AndroidUtilities.runOnUIThread(() -> SafeMode.showBlocked(ApplicationLoader.applicationContext, "Не удалось безопасно очистить EXIF — отправка изображения заблокирована"));
                    return ERROR_TYPE_UNSUPPORTED;
                }
                path = safeExif.path;
                originalPath = safeExif.path;
                uri = safeExif.uri;
            }
        }'''
        )

        // Location: message creation layer.
        patchAfterLiteral(
                sendHelper,
                "TGSAFE_SEND_CURRENT_LOCATION_GUARD",
                "public void sendCurrentLocation(final MessageObject messageObject, final TLRPC.KeyboardButton button) {",
                '''
        if (SafeMode.blockLocationSharing()) { // TGSAFE_SEND_CURRENT_LOCATION_GUARD
            return;
        }'''
        )

        patchAfterLiteral(
                sendHelper,
                "TGSAFE_SEND_LOCATION_GUARD",
                "private void sendLocation(Location location) {",
                '''
        if (SafeMode.blockLocationSharing()) { // TGSAFE_SEND_LOCATION_GUARD
            return;
        }'''
        )

        patchAfterLiteral(
                sendHelper,
                "TGSAFE_LOCATION_MEDIA_GUARD",
                "public void sendMessage(SendMessageParams sendMessageParams) {",
                '''
        if (SafeMode.blockLocationSharing() && SafeMode.isLocationMedia(sendMessageParams.location)) { // TGSAFE_LOCATION_MEDIA_GUARD
            return;
        }'''
        )

        // Location: ongoing/live-location machinery.
        patchAfterLiteral(locationController, "TGSAFE_FUSED_LOCATION_GUARD",
                "public void startFusedLocationRequest(boolean permissionsGranted) {",
                '''
        if (SafeMode.blockLocationSharing()) { // TGSAFE_FUSED_LOCATION_GUARD
            return;
        }''')

        patchAfterLiteral(locationController, "TGSAFE_BROADCAST_LOCATION_GUARD",
                "private void broadcastLastKnownLocation(boolean cancelCurrent) {",
                '''
        if (SafeMode.blockLocationSharing()) { // TGSAFE_BROADCAST_LOCATION_GUARD
            return;
        }''')

        patchAfterLiteral(locationController, "TGSAFE_ADD_LIVE_LOCATION_GUARD",
                "protected void addSharingLocation(TLRPC.Message message) {",
                '''
        if (SafeMode.blockLocationSharing()) { // TGSAFE_ADD_LIVE_LOCATION_GUARD
            return;
        }''')

        patchAfterLiteral(locationController, "TGSAFE_LOAD_OWN_LIVE_LOCATION_GUARD",
                "private void loadSharingLocations() {",
                '''
        if (SafeMode.blockLocationSharing()) { // TGSAFE_LOAD_OWN_LIVE_LOCATION_GUARD
            return;
        }''')

        patchAfterLiteral(locationController, "TGSAFE_LOCATION_SERVICE_GUARD",
                "private void startService() {",
                '''
        if (SafeMode.blockLocationSharing()) { // TGSAFE_LOCATION_SERVICE_GUARD
            return;
        }''')

        patchAfterLiteral(locationController, "TGSAFE_MAP_LOCATION_GUARD",
                "public void setMapLocation(Location location, boolean first) {",
                '''
        if (SafeMode.blockLocationSharing()) { // TGSAFE_MAP_LOCATION_GUARD
            return;
        }''')

        patchAfterLiteral(locationController, "TGSAFE_LOCATION_ACQUIRE_GUARD",
                "private void start() {",
                '''
        if (SafeMode.blockLocationSharing()) { // TGSAFE_LOCATION_ACQUIRE_GUARD
            return;
        }''')

        // Camera photo/video capture. Preview can exist, but capture cannot.
        patchImport(cameraController, "TGSAFE_CAMERA_IMPORT", "import org.telegram.messenger.SharedConfig;", "import org.telegram.messenger.SafeMode;")

        patchAfterLiteral(
                cameraController,
                "TGSAFE_PHOTO_CAPTURE_GUARD",
                "public boolean takePicture(final File path, final boolean ignoreOrientation, final Object sessionObject, final Utilities.Callback<Integer> callback) {",
                '''
        if (SafeMode.blockCameraCapture()) { // TGSAFE_PHOTO_CAPTURE_GUARD
            SafeMode.showBlocked(ApplicationLoader.applicationContext, "Камера отключена в TG Safe");
            return false;
        }'''
        )

        patchAfterLiteral(
                cameraController,
                "TGSAFE_VIDEO_CAPTURE_GUARD",
                "public void recordVideo(final Object sessionObject, final File path, boolean mirror, final VideoTakeCallback callback, final Runnable onVideoStartRecord, ICameraView cameraView, boolean createThumbnail) {",
                '''
        if (SafeMode.blockCameraCapture()) { // TGSAFE_VIDEO_CAPTURE_GUARD
            SafeMode.showBlocked(ApplicationLoader.applicationContext, "Камера отключена в TG Safe");
            return;
        }'''
        )

        // Incoming calls: block both the running service and Android's
        // pre-notification answer path.
        patchImport(voipService, "TGSAFE_VOIP_IMPORT", "import org.telegram.messenger.SharedConfig;", "import org.telegram.messenger.SafeMode;")
        patchAfterLiteral(
                voipService,
                "TGSAFE_CALL_ANSWER_GUARD",
                "public void acceptIncomingCall() {",
                '''
        if (SafeMode.blockIncomingCallAnswer()) { // TGSAFE_CALL_ANSWER_GUARD
            SafeMode.showBlocked(ApplicationLoader.applicationContext, "Принятие звонков отключено в TG Safe");
            return;
        }'''
        )

        patchImport(voipPre, "TGSAFE_PRECALL_IMPORT", "import org.telegram.messenger.R;", "import org.telegram.messenger.SafeMode;")
        patchAfterLiteral(
                voipPre,
                "TGSAFE_PRECALL_ANSWER_GUARD",
                "public static void answer(Context context) {",
                '''
        if (SafeMode.blockIncomingCallAnswer()) { // TGSAFE_PRECALL_ANSWER_GUARD
            SafeMode.showBlocked(context, "Принятие звонков отключено в TG Safe");
            return;
        }'''
        )

        // Persistent UI mode/account marker.
        patchImport(launchActivity, "TGSAFE_BADGE_IMPORT", "import org.telegram.ui.Components.SearchTagsList;", "import org.telegram.ui.Components.SafeModeBadge;")
        patchAfterLiteral(launchActivity, "TGSAFE_BADGE_INSTALL", "setContentView(frameLayout);",
                '''
        SafeModeBadge.install(frameLayout, this, currentAccount); // TGSAFE_BADGE_INSTALL''')
        patchAfterLiteral(launchActivity, "TGSAFE_BADGE_ACCOUNT_UPDATE", "switchingAccount = true;",
                '''
        SafeModeBadge.update(account); // TGSAFE_BADGE_ACCOUNT_UPDATE''')

        logger.lifecycle("TG Safe: fail-closed source guards applied/verified")
    }
}

gradle.projectsEvaluated {
    def tgMessagesProject = rootProject.findProject(':TMessagesProj')
    if (tgMessagesProject != null && tgMessagesProject.extensions.findByName('android') != null) {
        tgMessagesProject.android.sourceSets.main.java.srcDir(tgSafeGeneratedSourceRoot)
    }

    rootProject.subprojects.each { p ->
        p.tasks.matching { it.name == "preBuild" }.configureEach {
            dependsOn(rootProject.tasks.named("applyTgSafePatches"))
        }
    }
}